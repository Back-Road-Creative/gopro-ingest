[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gopro-ingest"
version = "0.1.0"
description = "Reassemble GoPro chapter files into episodes and pair them with GPS you can trust."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Joe Petrucelli", email = "joepetjr@gmail.com" }]
keywords = ["gopro", "gpmf", "gpx", "gps", "telemetry", "video", "ingest", "ffprobe"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Video",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "defusedxml>=0.7.1",
]

[project.optional-dependencies]
# Binary GPMF parsing. Only needed by extract_gopro_gpx(); everything else
# in the package works without it.
gopro = ["gopro-overlay>=0.128.0"]
dev = [
  "pytest>=7.4",
  "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["gopro_ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
